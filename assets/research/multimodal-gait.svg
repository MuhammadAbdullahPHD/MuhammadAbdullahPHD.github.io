<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" role="img" aria-labelledby="title desc">
<title id="title">EEG, EMG, IMU and force measurements during gait</title><desc id="desc">Stylized walking figure wearing representative EEG, EMG and IMU sensors above a split-belt force treadmill. Sensor positions are illustrative, not a placement guide. Force recording was manually initiated near-synchronously; the other modalities used a trigger protocol. No recorded signals are displayed.</desc>
